[package]
name = "shortcut"
version = "0.4.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
adw = { version = "0.8.1", package = "libadwaita", features = ["v1_8"] }
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_20"] }
freedesktop_entry_parser = { version = "1.3.0" }
anyhow = "1.0.75"

[build-dependencies]
glib-build-tools = "0.18.0"
